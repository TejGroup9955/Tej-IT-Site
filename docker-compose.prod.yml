# Production Docker Compose for Tej IT Site
version: '3.8'

services:
  # Backend service (Flask)
  tej-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: tej-backend-prod
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - PORT=5001
      - FRONTEND_URL=http://10.10.50.93:3001
    volumes:
      - backend_uploads:/app/static/uploads
    restart: unless-stopped
    networks:
      - tej-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Frontend service (Next.js)
  tej-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: tej-frontend-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://10.10.50.93:5001
    depends_on:
      tej-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tej-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

# Networks
networks:
  tej-network:
    driver: bridge
    name: tej-production-network

# Volumes for persistent data
volumes:
  backend_uploads:
    driver: local
    name: tej-backend-uploads