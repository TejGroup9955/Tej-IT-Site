# Production-like Docker Compose configuration
# Use this for testing production builds locally
version: '3.8'

services:
  # Backend service (production build)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Use production stage for optimized image
      target: production
    
    container_name: tej-backend-prod
    
    ports:
      - "5000:5000"
    
    # Production environment variables
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
    
    # No volume mounts in production (code is baked into image)
    restart: unless-stopped
    
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Frontend service (production build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Use production stage for optimized image
      target: production
    
    container_name: tej-frontend-prod
    
    ports:
      - "3000:3000"
    
    # Production environment variables
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    
    # No volume mounts in production
    restart: unless-stopped
    
    # Frontend depends on backend
    depends_on:
      - backend
    
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Production network configuration
networks:
  default:
    name: tej-network-prod
    driver: bridge

# Production volumes (if needed for data persistence)
volumes:
  backend_data:
    driver: local